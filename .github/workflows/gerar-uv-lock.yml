name: gerar-uv-lock

on:
  push:
    paths:
      - ".github/workflows/gerar-uv-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-e-teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Gerar uv.lock e instalar
        run: |
          uv lock
          uv sync
          uv run python -c "import google.adk; print('ADK', google.adk.__version__)"

      - name: Teste de fumaca (sem chamar o modelo)
        env:
          GOOGLE_API_KEY: chave-falsa-so-para-subir
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
        run: |
          uv run python -m aurora.restaurar
          uv run python -m aurora.api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:8000/apartamentos/101/reservas && break; sleep 1; done
          uv run python - <<'PY'
          import json, urllib.request, urllib.error
          B = "http://localhost:8000"
          def req(metodo, rota, corpo=None):
              dados = json.dumps(corpo).encode() if corpo is not None else None
              r = urllib.request.Request(B + rota, data=dados, method=metodo,
                                         headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
          s, r = req("GET", "/apartamentos/101/reservas"); print(s, r)
          assert s == 200 and r[0]["codigo"] == "RSV-1377"
          s, r = req("GET", "/apartamentos/302/visitantes"); print(s, r)
          assert s == 200 and r[0]["nome"] == "Marina Duarte"
          s, r = req("POST", "/sessoes", {"apartamento": "101"}); print(s, r)
          assert s == 201
          sid = r["session_id"]
          s, r = req("GET", f"/sessoes/{sid}/eventos"); print(s, r)
          assert s == 200 and r == []
          s, r = req("POST", f"/sessoes/{sid}/confirmacoes", {"id": "id-inexistente", "confirmado": True}); print(s, r)
          assert s == 409
          s, r = req("GET", "/sessoes/sessao-inexistente/eventos"); print(s, r)
          assert s == 404
          print("TESTE DE FUMACA OK")
          PY
          kill %1 || true
          cat api.log

      - name: Commit do uv.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Adiciona uv.lock" || echo "nada a commitar"
          git push
